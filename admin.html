<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04102E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="별오름 운영">
  <title>별오름 운영</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --night: #04102E; --night-2: #111C40; --ink: #EEF1FA; --muted: #9AA6CC; --dim: #6F7BA3;
      --gold: #F7C164; --gold-2: #FFD98C; --gold-ink: #2B1C02;
      --glass-line: rgba(255,255,255,.16); --test: #F2A65A; --danger: #FF8C82;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0; background: var(--night); color: var(--ink); overflow-x: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 배경: 별, 반짝이, 등고선 */
    #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      background: var(--night); }
    #sky .dot { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--t); }
    #sky .spark { position: absolute; width: 14px; height: 14px; animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--t); }
    #sky .contour { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

    .page { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; }

    /* 히어로: 산 + 제목 */
    .hero { position: relative; overflow: hidden; }
    .hero img.bg { display: block; width: 100%; height: auto; }
    .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(4,16,46,0) 40%, rgba(4,16,46,.5) 70%, var(--night) 100%); }
    .peak-glow { position: absolute; left: 50.5%; top: 25.9%; width: 34%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(255,217,140,.5), rgba(255,217,140,0) 62%); mix-blend-mode: screen;
      animation: pulse 3.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.85); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } }
    @media (min-width: 461px) { .hero img.bg { -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); } }
    .titles { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; z-index: 2; }
    .logo { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; overflow: hidden; border: 2px solid rgba(247,193,100,.6); box-shadow: 0 0 24px rgba(247,193,100,.35); }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .eyebrow { font-size: 12px; letter-spacing: 9px; padding-left: 9px; color: #C9D1EC; }
    h1 { font-size: 34px; font-weight: 800; margin: 6px 0 8px; letter-spacing: -1px; text-shadow: 0 2px 18px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.4); }
    .eyebrow, .tagline { text-shadow: 0 1px 8px rgba(0,0,0,.8); }
    .tagline { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 14px; color: #C3CBE6; }
    .tagline::before, .tagline::after { content: ''; width: 56px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
    .tagline::after { transform: scaleX(-1); }

    .wrap { position: relative; z-index: 2; padding: 0 16px 48px; margin-top: -18px; }
    .card {
      position: relative; border-radius: 26px; padding: 20px 18px; margin-bottom: 16px;
      background: linear-gradient(180deg, rgba(52,66,118,.45) 0%, rgba(16,26,58,.55) 100%);
      border: 1px solid var(--glass-line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.35);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }

    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    select, input[type=password] {
      width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 16px;
      border: 1px solid var(--glass-line); background: rgba(8,14,36,.55); color: var(--ink); outline: none;
    }
    select:focus, input:focus { border-color: var(--gold); }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--muted); }
    .chk input { width: 18px; height: 18px; accent-color: var(--gold); }

    .btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 20px; margin-top: 12px;
      border-radius: 22px; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(255,255,255,.22); color: var(--ink);
      background: linear-gradient(180deg, rgba(20,30,64,.75), rgba(10,17,42,.75));
      transition: transform .1s ease, filter .2s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; }
    .btn .label { flex: 1; text-align: center; }
    .btn .chev { opacity: .8; }
    .btn.primary {
      color: var(--gold-ink); border-color: transparent;
      background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold) 100%);
      box-shadow: 0 8px 24px rgba(247,193,100,.3), inset 0 1px 0 rgba(255,255,255,.5);
    }
    .btn.armed { background: var(--danger); color: #3b0d09; border-color: transparent; }

    .who { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px; }
    .who .me { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .who .me small { font-size: 14px; font-weight: 400; color: var(--muted); }
    .linkbtn { display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
    .linkbtn svg.i { width: 18px; height: 18px; }

    .hint { display: flex; gap: 10px; margin-top: 16px; font-size: 13px; line-height: 1.6; color: #B7C0DE; }
    .hint svg.i { margin-top: 2px; color: var(--muted); }
    .hint b { color: var(--gold); font-weight: 600; }
    .msg { font-size: 14px; color: var(--danger); margin-top: 10px; min-height: 1em; }

    /* QR 카드 */
    .qrcard { text-align: center; padding: 22px 16px 20px; }
    .badge-row { display: flex; align-items: center; gap: 12px; }
    .badge-row::before, .badge-row::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(247,193,100,.6)); }
    .badge-row::after { transform: scaleX(-1); }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 600;
      color: var(--gold); background: rgba(10,17,42,.7); border: 1px solid rgba(247,193,100,.4); }
    .badge svg.i { width: 18px; height: 18px; }
    .badge.test { color: var(--test); border-color: rgba(242,166,90,.45); }

    .stage { position: relative; height: 300px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: center; }
    .orbit { position: absolute; left: 50%; top: 50%; width: 360px; height: 300px; transform: translate(-50%,-50%); pointer-events: none; }
    .orbit .ring { animation: spinglow 6s ease-in-out infinite; }
    @keyframes spinglow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .orbit .sp { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orbit .sp:nth-of-type(2) { animation-delay: -1s; } .orbit .sp:nth-of-type(3) { animation-delay: -2s; }
    .qrframe {
      position: relative; z-index: 1; padding: 12px; background: #fff; border-radius: 22px; cursor: zoom-in;
      box-shadow: 0 0 0 2px rgba(255,217,140,.9), 0 0 28px rgba(247,193,100,.55), 0 0 70px rgba(247,193,100,.25);
    }
    .qrframe.test { box-shadow: 0 0 0 2px rgba(242,166,90,.9), 0 0 28px rgba(242,166,90,.5); }
    .qrframe img { display: block; width: min(56vw, 230px); height: min(56vw, 230px); }

    .tap { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .tap svg.i { width: 16px; height: 16px; }
    .date { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 20px; border-radius: 999px;
      font-size: 17px; font-weight: 700; color: var(--gold); background: rgba(10,17,42,.6); border: 1px solid rgba(247,193,100,.3); }
    .meta { font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.6; }

    .count { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .count::before, .count::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25)); }
    .count::after { transform: scaleX(-1); }
    .count span { font-size: 16px; color: #C3CBE6; }
    .count strong { font-size: 40px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
    .bump { animation: bump .6s ease; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); color: var(--gold); } 100% { transform: scale(1); } }


    #big { position: fixed; inset: 0; z-index: 10; background: radial-gradient(90% 60% at 50% 40%, #1A2656, var(--night));
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
    #big .qrframe { padding: 16px; border-radius: 26px; cursor: zoom-out; }
    #big .qrframe img { width: min(calc(100vw - 80px), 66vh); height: min(calc(100vw - 80px), 66vh); }
    #big .date { margin-top: 24px; font-size: 19px; }
    #big .count { border: 0; width: 100%; max-width: 360px; margin-top: 10px; }
    #big .tap { margin-top: 18px; }
    .tabs { display: flex; gap: 6px; padding: 5px; margin: 14px 0 4px; border-radius: 18px; background: rgba(8,14,36,.55); border: 1px solid var(--glass-line); }
    .tab { flex: 1; padding: 11px 8px; border-radius: 14px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .tab.on { background: rgba(247,193,100,.16); color: var(--gold); }
    .st-head { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .st-head b { font-size: 20px; font-weight: 800; }
    .st-head small { font-size: 14px; color: var(--muted); margin-left: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .stat { text-align: center; padding: 12px 6px; border-radius: 16px; background: rgba(8,14,36,.45); border: 1px solid var(--glass-line); }
    .stat b { display: block; font-size: 26px; font-weight: 800; line-height: 1.2; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.s-short b { color: var(--danger); } .stat.s-done b { color: #9FE1CB; } .stat.s-ex b { color: #C9D1EC; }
    .sec { margin-top: 20px; }
    .sec h3 { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
    .sec h3 small { color: var(--dim); font-weight: 500; margin-left: 4px; }
    details.sec summary { list-style: none; cursor: pointer; }
    details.sec summary::-webkit-details-marker { display: none; }
    details.sec .more { color: var(--gold); }
    details[open].sec .more { visibility: hidden; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 16px; }
    .row small { color: var(--dim); font-size: 12px; margin-left: 6px; }
    .pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .p-short { background: rgba(255,140,130,.14); color: var(--danger); }
    .p-done { background: rgba(159,225,203,.14); color: #9FE1CB; }
    .p-ex { background: rgba(154,166,204,.16); color: #C9D1EC; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 14px; padding: 6px 11px; border-radius: 999px; background: rgba(8,14,36,.55); border: 1px solid var(--glass-line); }
    .chip small { color: var(--dim); margin-left: 4px; font-size: 12px; }
    .none { font-size: 14px; color: var(--dim); padding: 8px 2px; }
    .warnbox { display: flex; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(242,166,90,.12); color: var(--test); font-size: 13px; line-height: 1.6; }
    .warnbox svg.i { margin-top: 2px; }
    .btn.self { margin-top: 18px; color: var(--gold); border-color: rgba(247,193,100,.5); background: rgba(247,193,100,.08); }
    .btn.self.done { color: #9FE1CB; border-color: rgba(159,225,203,.4); background: rgba(159,225,203,.08); cursor: default; }
    .btn.self .label { flex: none; }
    .btn.self { justify-content: center; }
    .homehint { display: flex; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 16px; background: rgba(247,193,100,.1); border: 1px solid rgba(247,193,100,.35); color: var(--gold); }
    .homehint svg.i { margin-top: 2px; }
    .homehint b { display: block; font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .homehint span { display: block; font-size: 13px; line-height: 1.6; color: #D9C9A3; }
    .homehint .linkbtn { margin-top: 8px; color: var(--gold); font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="sky">
  <svg class="contour" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="rgba(150,170,230,.12)" stroke-width="1">
      <path d="M-20 120 C 60 60, 120 180, 210 110 S 360 40, 430 120"/>
      <path d="M-20 150 C 70 90, 120 210, 215 140 S 360 70, 430 150"/>
      <path d="M-20 520 C 80 460, 150 580, 240 500 S 370 450, 430 520"/>
      <path d="M-20 555 C 90 495, 150 615, 245 535 S 375 485, 430 555"/>
    </g>
  </svg>
</div>

<div class="page">
  <div class="hero">
    <img class="bg" alt="" src="hero.webp">
    <div class="peak-glow"></div>
    <div class="titles">
      <div class="logo hidden" id="logo"></div>
      <div class="eyebrow">BYEOLOREUM</div>
      <h1>별오름 운영</h1>
      <div class="tagline">함께 오르는 우리, 별이 되는 순간까지</div>
    </div>
  </div>

  <div class="wrap">
    <div id="login" class="card">
      <label for="name">이름</label>
      <select id="name"><option value="">불러오는 중…</option></select>
      <label for="pin">운영 PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <label class="chk"><input type="checkbox" id="remember" checked> 다음부터 자동 로그인</label>
      <button class="btn primary" id="btnLogin"><span class="label">로그인</span></button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="panel" class="hidden">
      <div class="card">
        <div class="who">
          <div class="me">
            <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
            <span id="whoName"></span><small id="whoRole"></small>
          </div>
          <button class="linkbtn" id="btnLogout">
            <svg class="i" viewBox="0 0 24 24"><path d="M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12l-3-3m0 6l3-3"/></svg>
            로그아웃
          </button>
        </div>
        <div class="tabs">
          <button class="tab on" id="tabQR">QR 발급</button>
          <button class="tab" id="tabStatus">이번 달 현황</button>
        </div>
        <div id="vStatus" class="hidden">
          <div class="st-head">
            <div><b id="sMonth"></b><small id="sReq"></small></div>
            <button class="linkbtn" id="btnRefresh">
              <svg class="i" viewBox="0 0 24 24"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
              새로고침
            </button>
          </div>
          <div class="stats">
            <div class="stat s-short"><b id="nShort">-</b><span>미달</span></div>
            <div class="stat s-done"><b id="nDone">-</b><span>충족</span></div>
            <div class="stat s-ex"><b id="nEx">-</b><span>면제</span></div>
          </div>
          <div id="sWarn"></div>
          <div class="sec">
            <h3><span>오늘 체크인</span><span id="sTodayN"></span></h3>
            <div class="chips" id="sToday"></div>
          </div>
          <div class="sec">
            <h3><span>미달</span><span>부족</span></h3>
            <div id="sShort"></div>
          </div>
          <div class="sec">
            <h3><span>면제</span><span>출석</span></h3>
            <div id="sEx"></div>
          </div>
          <details class="sec">
            <summary><h3><span>충족 <small id="sDoneN"></small></span><span class="more">펼치기</span></h3></summary>
            <div id="sDone"></div>
          </details>
          <div class="msg" id="statusMsg"></div>
        </div>
        <div id="vQR">
        <button class="btn primary" id="btnToday">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 7V6a2 2 0 0 1 2-2h2M4 17v1a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v1M16 20h2a2 2 0 0 0 2-2v-1"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="13" width="3" height="3"/><path d="M13 8h3v2M8 13v3h2"/></svg>
          <span class="label" id="todayLabel">오늘 출석 QR 받기</span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="btn" id="btnReissue">
          <svg class="i" viewBox="0 0 24 24"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
          <span class="label" id="reissueLabel">강제 재발급</span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="msg" id="panelMsg"></div>
        <div class="hint">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <span id="hint"></span>
        </div>
        </div>
      </div>

      <div id="qrCard" class="card qrcard hidden">
        <div class="badge-row">
          <span class="badge" id="badge">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 17.75l-6.17 3.24 1.18-6.87-5-4.86 6.9-1 3.09-6.26 3.09 6.26 6.9 1-5 4.86 1.18 6.87z"/></svg>
            <span id="badgeText">정식 출석 QR</span>
          </span>
        </div>
        <div class="stage">
          <svg class="orbit" viewBox="0 0 360 300" aria-hidden="true">
            <ellipse class="ring" cx="180" cy="150" rx="172" ry="44" transform="rotate(-14 180 150)" fill="none" stroke="#F7C164" stroke-width="1.6"/>
            <path class="sp" d="M60 118 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#FFD98C"/>
            <path class="sp" d="M300 72 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#FFD98C"/>
            <path class="sp" d="M318 178 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFF3D6"/>
          </svg>
          <div class="qrframe" id="qrFrame"><img id="qrImg" alt="출석 QR 코드"></div>
        </div>
        <div class="tap">
          <svg class="i" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6M7 10h6M10 7v6"/></svg>
          QR을 누르면 크게 볼 수 있어요
        </div><br>
        <div class="date">
          <svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M8 15h2v2H8z"/></svg>
          <span id="qrDate"></span>
        </div>
        <div class="meta" id="qrMeta"></div>
        <div class="count"><span>오늘 체크인</span><strong id="cnt">0</strong><span>명</span></div>
        <button class="btn self" id="btnSelf">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
          <span class="label" id="selfLabel">나도 체크인</span>
        </button>
        <div class="msg" id="selfMsg"></div>
      </div>
    </div>
  </div>
</div>

<div id="big" class="hidden">
  <div class="qrframe" id="bigFrame"><img id="bigImg" alt="출석 QR 코드 크게 보기"></div>
  <div class="date">
    <svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16M8 15h2v2H8z"/></svg>
    <span id="bigDate"></span>
  </div>
  <div class="count"><span>오늘 체크인</span><strong id="bigCnt">0</strong><span>명</span></div>
  <div class="tap">아무 곳이나 누르면 닫혀요</div>
</div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'byeoloreum_admin';
  let cred = null, armTimer = null, pollTimer = null, lastCount = null;

  const QR_KEY = 'byeoloreum_qr';
  App.makeSky($('sky'), 70, 0, [[12, 9], [86, 14], [6, 38], [92, 46], [10, 72], [88, 80]]);
  const esc = App.esc, clean = App.clean, call = App.api, deviceId = App.deviceId;
  function saveCred(c) { App.store.set(KEY, c || null); }
  function loadCred() { return App.store.get(KEY); }
  function setBusy(b) {
    document.querySelectorAll('.wrap button').forEach((el) => { el.disabled = b; });
  }

  async function init() {
    App.loadLogo($('logo'));
    call('apiOperators').then((names) => {
      const cur = $('name').value;
      $('name').innerHTML = names.length
        ? names.map((n) => `<option>${esc(n)}</option>`).join('')
        : '<option value="">등록된 운영진이 없어요</option>';
      if (cur && names.includes(cur)) $('name').value = cur;
    }).catch((e) => { $('loginMsg').textContent = clean(e); });

    // 저장된 로그인이 있으면 서버 확인을 기다리지 않고 바로 화면을 연다
    const saved = loadCred();
    if (saved && saved.name && saved.pin) {
      cred = { name: saved.name, pin: saved.pin };
      showPanel({ name: saved.name, role: saved.role || '운영진', staff: true });
      call('apiLogin', cred.name, cred.pin).then((me) => {
        $('whoRole').textContent = me.role;
        saveCred({ name: me.name, pin: cred.pin, role: me.role });
      }).catch((e) => {
        logout();
        $('loginMsg').textContent = clean(e) + ' 다시 로그인해 주세요.';
      });
    }
  }

  async function login() {
    const name = $('name').value;
    const pin = $('pin').value.trim();
    if (!name || !pin) { $('loginMsg').textContent = '이름과 PIN을 입력해 주세요.'; return; }
    setBusy(true);
    $('loginMsg').textContent = '';
    try {
      const me = await call('apiLogin', name, pin);
      let secret = pin;
      if ($('remember').checked) {
        // 폰에는 PIN 대신 자동 로그인 키를 저장한다
        try { secret = await call('apiMakeToken', name, pin); } catch (e) {}
        saveCred({ name: me.name, pin: secret, role: me.role });
      } else {
        saveCred(null);
      }
      cred = { name: me.name, pin: secret };
      $('pin').value = '';
      showPanel(me);
    } catch (e) {
      $('loginMsg').textContent = clean(e);
    }
    setBusy(false);
  }

  function showPanel(me) {
    $('login').classList.add('hidden');
    $('panel').classList.remove('hidden');
    $('whoName').textContent = me.name;
    $('whoRole').textContent = me.role;
    setTab('qr');
    const cached = App.store.get(QR_KEY);
    if (cached && cached.date === App.todayKST()) renderQR(cached, false);
    loadTodayQR();
    $('btnToday').classList.toggle('hidden', !me.staff);
    $('btnReissue').classList.toggle('hidden', !me.staff);
    $('hint').innerHTML = me.staff
      ? '오늘 QR은 <b>하루에 하나</b>예요. 다른 운영진이 먼저 받았다면 같은 QR이 나옵니다. 자정이 지나면 자동으로 만료돼요.'
      : '테스터 계정은 <b>테스트 QR</b>만 받을 수 있어요. 테스트 출석은 집계에 들어가지 않아요.';
  }

  function logout() {
    saveCred(null);
    App.store.set(QR_KEY, null);
    cred = null;
    stopPolling();
    $('pin').value = '';
    $('qrCard').classList.add('hidden');
    $('qrImg').removeAttribute('src');
    $('todayLabel').textContent = '오늘 출석 QR 받기';
    $('panel').classList.add('hidden');
    $('login').classList.remove('hidden');
  }

  function setCount(n) {
    ['cnt', 'bigCnt'].forEach((id) => {
      const el = $(id);
      el.textContent = n;
      if (lastCount !== null && n > lastCount) {
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
    });
    lastCount = n;
  }

  async function issue(mode) {
    setBusy(true);
    $('panelMsg').textContent = '';
    try {
      const r = await call('apiIssue', cred.name, cred.pin, mode);
      renderQR(r, true);
    } catch (e) {
      $('panelMsg').textContent = clean(e);
    }
    setBusy(false);
  }

  /** 오늘 이미 발급된 QR이 있으면 버튼 없이 바로 보여준다 */
  async function loadTodayQR() {
    if (!cred) return;
    try {
      const r = await call('apiTodayQR', cred.name, cred.pin);
      if (r) renderQR(r, false);
    } catch (e) {}
  }

  function renderQR(r, scroll) {
    $('badgeText').textContent = r.test ? '테스트 QR · 집계 제외' : '정식 출석 QR';
    $('badge').classList.toggle('test', r.test);
    $('qrFrame').classList.toggle('test', r.test);
    $('bigFrame').classList.toggle('test', r.test);
    $('qrImg').src = $('bigImg').src = r.link ? App.qrDataUrl(r.link) : r.qr;
    $('qrDate').textContent = $('bigDate').textContent = `${r.dateLabel} 자정까지 유효`;
    $('qrMeta').textContent = `발급 ${r.issuedBy}` + (r.reissued ? ' · 재발급 완료, 이전 QR은 무효예요' : '');
    lastCount = null;
    setCount(r.count);
    if (r.meChecked) setSelfDone('오늘 체크인 완료'); else resetSelf();
    $('todayLabel').textContent = '오늘 QR 다시 보기';
    $('qrCard').classList.toggle('hidden', !$('vStatus').classList.contains('hidden'));
    if (scroll) $('qrCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (r.link) {
      App.store.set(QR_KEY, { link: r.link, date: r.date || App.todayKST(), dateLabel: r.dateLabel,
        issuedBy: r.issuedBy, count: r.count, meChecked: r.meChecked, test: false, reissued: false });
    }
    startPolling();
  }

  async function refreshCount() {
    if (!cred || document.hidden) return;
    try { setCount(await call('apiTodayCount', cred.name, cred.pin)); } catch (e) {}
  }
  function startPolling() { stopPolling(); pollTimer = setInterval(refreshCount, 15000); }
  function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  function openBig() { $('big').classList.remove('hidden'); refreshCount(); }
  function closeBig() { $('big').classList.add('hidden'); }

  function onReissue() {
    const btn = $('btnReissue');
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed');
      $('reissueLabel').textContent = '한 번 더 누르면 재발급';
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    issue('reissue');
  }
  function disarm() {
    $('btnReissue').classList.remove('armed');
    $('reissueLabel').textContent = '강제 재발급';
  }

  $('btnLogin').addEventListener('click', () => login());
  $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  $('btnLogout').addEventListener('click', logout);
  $('btnToday').addEventListener('click', () => issue('today'));
  $('btnReissue').addEventListener('click', onReissue);
  function setTab(t) {
    const st = t === 'status';
    $('tabQR').classList.toggle('on', !st);
    $('tabStatus').classList.toggle('on', st);
    $('vQR').classList.toggle('hidden', st);
    $('vStatus').classList.toggle('hidden', !st);
    $('qrCard').classList.toggle('hidden', st || !$('qrImg').getAttribute('src'));
    if (st) loadStatus();
  }

  async function loadStatus() {
    $('statusMsg').textContent = '';
    $('btnRefresh').disabled = true;
    try {
      const s = await call('apiStatus', cred.name, cred.pin);
      $('sMonth').textContent = `${s.monthLabel} 현황`;
      $('sReq').textContent = `필참 ${s.required}회`;
      $('nShort').textContent = s.short.length;
      $('nDone').textContent = s.done.length;
      $('nEx').textContent = s.exempt.length;
      $('sTodayN').textContent = `${s.today.length}명 · ${s.dateLabel}`;
      $('sToday').innerHTML = s.today.length
        ? s.today.map((p) => `<span class="chip">${esc(p.name)}<small>${esc(p.time)}</small></span>`).join('')
        : '<div class="none">아직 체크인한 사람이 없어요</div>';
      const row = (p, pill, cls) =>
        `<div class="row"><span>${esc(p.name)}<small>${esc(p.role)}</small></span><span class="pill ${cls}">${pill}</span></div>`;
      $('sShort').innerHTML = s.short.length
        ? s.short.map((p) => row(p, `${p.count}회 · ${p.need}회 부족`, 'p-short')).join('')
        : '<div class="none">미달인 사람이 없어요</div>';
      $('sEx').innerHTML = s.exempt.length
        ? s.exempt.map((p) => row(p, `${p.count}회`, 'p-ex')).join('')
        : '<div class="none">이번 달 면제자는 없어요</div>';
      $('sDoneN').textContent = s.done.length + '명';
      $('sDone').innerHTML = s.done.length
        ? s.done.map((p) => row(p, `${p.count}회`, 'p-done')).join('')
        : '<div class="none">아직 충족한 사람이 없어요</div>';
      $('sWarn').innerHTML = s.warnings.length
        ? `<div class="warnbox"><svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>오늘 같은 폰에서 여러 명이 체크인했어요: ${s.warnings.map((w) => esc(w.join(', '))).join(' / ')}</span></div>`
        : '';
    } catch (e) {
      $('statusMsg').textContent = clean(e);
    }
    $('btnRefresh').disabled = false;
  }

  function setSelfDone(text) {
    $('btnSelf').classList.add('done');
    $('selfLabel').textContent = text;
  }
  function resetSelf() {
    $('btnSelf').classList.remove('done');
    $('selfLabel').textContent = '나도 체크인';
    $('selfMsg').textContent = '';
  }

  async function selfCheckin() {
    if ($('btnSelf').classList.contains('done')) return;
    $('btnSelf').disabled = true;
    $('selfMsg').textContent = '';
    try {
      const r = await call('apiStaffCheckin', cred.name, cred.pin, deviceId());
      const tail = r.exempt ? '이번 달 면제' : `${r.monthLabel} ${r.count}회`;
      setSelfDone(`${r.already ? '이미 체크인했어요' : '체크인 완료'} · ${tail}`);
      setCount(r.todayCount);
    } catch (e) {
      $('selfMsg').textContent = clean(e);
    }
    $('btnSelf').disabled = false;
  }

  $('btnSelf').addEventListener('click', selfCheckin);
  $('tabQR').addEventListener('click', () => setTab('qr'));
  $('tabStatus').addEventListener('click', () => setTab('status'));
  $('btnRefresh').addEventListener('click', loadStatus);
  $('qrFrame').addEventListener('click', openBig);
  $('big').addEventListener('click', closeBig);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (!$('qrImg').getAttribute('src')) loadTodayQR(); else refreshCount();
  });
  init();
</script>
</body>
</html>
